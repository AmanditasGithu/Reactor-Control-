name: CI Reactor Control

# Corre en cada push a cualquier rama y en cada Pull Request a main o develop.
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r frontend/requirements.txt
          pip install -r Logica-juego-backend/requirements.txt

      - name: Revisar que compilen las arenas y el juego
        run: |
          python -m py_compile Arenas/*.py Logica_ReactorControl.py Adapter.py celdas_energia.py

      - name: Pruebas del backend (cuentas, login, ranking, celular)
        working-directory: backend
        run: python -m pytest -v

      - name: Pruebas del frontend (pantallas, juego, celdas de energía)
        working-directory: frontend
        run: python -m pytest -v

      - name: Pruebas del servidor de partidas (bonificaciones, marcador, resultados)
        working-directory: Logica-juego-backend
        run: python -m pytest -v
