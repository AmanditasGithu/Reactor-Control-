name: CI Reactor Control

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validar-python:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias del sistema para Pygame
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pygame pyserial pytest
          fi

      - name: Verificar compilación de scripts Python
        run: |
          python -m py_compile Arenas/*.py

      - name: Ejecutar pruebas si existen
        run: |
          if ls test_*.py *_test.py Arenas/test_*.py Arenas/*_test.py 1> /dev/null 2>&1; then
            pytest -v
          else
            echo "Sin tests unitarios; compilación verificada."
          fi
