# Levanta la base de datos y el backend para desarrollo local.
# Uso:  docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: reactor
      POSTGRES_PASSWORD: reactor
      POSTGRES_DB: reactor
    ports:
      - "5432:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reactor -d reactor"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://reactor:reactor@db:5432/reactor
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos_postgres: